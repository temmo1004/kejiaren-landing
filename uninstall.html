<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>再見了 · 客＋人 · 幫我們變更好</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E3B26">
<link rel="icon" href="./icon128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Chocolate+Classical+Sans&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1EFE4;--paper:#FFF;--ink:#1C2B22;--mut:#6B685C;--line:#E3DECE;
    --brand:#17734A;--brand-dk:#0E4A2E;--deep:#0E3B26;--lime:#C9E86F;--cream:#F7F0DC;--gold-ink:#9A6B12;
    --shadow:0 1px 2px rgba(14,59,36,.06),0 10px 34px rgba(14,59,36,.08);
    --shadow-hi:0 8px 20px rgba(14,59,36,.22),0 26px 60px rgba(14,59,36,.24);
    --sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif;--disp:"Chocolate Classical Sans","Noto Sans TC",sans-serif;
  }
  @media(prefers-color-scheme:dark){:root{--bg:#101710;--paper:#182118;--ink:#EAF1E6;--mut:#93A392;--line:#26332A;--cream:#25301E;--gold-ink:#D8C68A;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.35);--shadow-hi:0 8px 20px rgba(0,0,0,.5),0 26px 60px rgba(0,0,0,.5)}}
  :root[data-theme="light"]{--bg:#F1EFE4;--paper:#FFF;--ink:#1C2B22;--mut:#6B685C;--line:#E3DECE;--cream:#F7F0DC;--gold-ink:#9A6B12}
  :root[data-theme="dark"]{--bg:#101710;--paper:#182118;--ink:#EAF1E6;--mut:#93A392;--line:#26332A;--cream:#25301E;--gold-ink:#D8C68A}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 22px}
  .hero{text-align:center;padding:70px 0 8px}
  .logo{width:52px;height:52px;margin:0 auto;opacity:.9}
  h1{font-family:var(--disp);font-size:clamp(26px,5vw,36px);font-weight:900;line-height:1.2;margin-top:20px;text-wrap:balance}
  .lede{font-size:16px;color:var(--ink);opacity:.82;max-width:36ch;margin:14px auto 0}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:var(--shadow);margin:34px 0}
  .card h3{font-size:16px;font-weight:800;text-align:center;margin-bottom:4px}
  .card .sub{font-size:13.5px;color:var(--mut);text-align:center;margin-bottom:18px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip{background:var(--cream);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;transition:.14s;font-family:inherit}
  .chip:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
  .thanks{display:none;text-align:center;padding:8px 0}
  .thanks .big{font-family:var(--disp);font-size:22px;font-weight:850;color:var(--brand)}
  .thanks p{font-size:14px;color:var(--mut);margin-top:6px}
  .cbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 16px}
  .bigcta{background:var(--brand);color:#fff;text-decoration:none;font-weight:800;font-size:15px;padding:13px 24px;border-radius:12px;box-shadow:var(--shadow-hi);transition:.15s}
  .bigcta:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .bigcta.sec{background:var(--paper);color:var(--ink);box-shadow:var(--shadow);border:1.5px solid var(--line)}
  .foot{text-align:center;color:var(--mut);font-size:13px;padding:20px 0 48px}
  .foot a{color:var(--brand);font-weight:700}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <img class="logo" src="./icon128.png" alt="客＋人" width="56" height="56">
      <h1>捨不得你走 😢</h1>
      <p class="lede">你已移除「客＋人」。能花 5 秒告訴我們哪裡不順手嗎？一個字都不用打，點一下就好。</p>
    </div>

    <div class="card">
      <div id="ask">
        <h3>是哪裡讓你想移除？</h3>
        <div class="sub">匿名，只用來把產品變更好</div>
        <div class="chips">
          <button class="chip" data-r="no_button">找不到按鈕／不會用</button>
          <button class="chip" data-r="draft_quality">草稿寫得不夠好</button>
          <button class="chip" data-r="too_slow">太慢／卡卡的</button>
          <button class="chip" data-r="not_needed">用不太到</button>
          <button class="chip" data-r="price">價格考量</button>
          <button class="chip" data-r="privacy">擔心資料隱私</button>
          <button class="chip" data-r="other">其他</button>
        </div>
      </div>
      <div id="thanks" class="thanks">
        <div class="big">謝謝你 🙏</div>
        <p>收到了，我們會用它把「客＋人」做得更好。</p>
      </div>
    </div>

    <div class="cbtns">
      <a class="bigcta" href="https://chromewebstore.google.com/detail/ikaeacbpmjkaddigkhkacgnmfgohpkoi" target="_blank" rel="noopener">改變主意？重新安裝</a>
      <a class="bigcta sec" href="./index.html">回首頁看看</a>
    </div>

    <div class="foot">
      你的店家知識仍以獨立金鑰加密保存；如需刪除資料 → <a href="./index.html#contact">聯絡我們</a> · <a href="./privacy.html">隱私政策</a>
    </div>
  </div>
  <script>
    try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}
    // 匿名回饋:點原因→beacon 回 kernel(收集流失原因)。失敗也不影響頁面。
    document.querySelectorAll(".chip").forEach(function(b){
      b.addEventListener("click",function(){
        var reason=b.dataset.r;
        try{
          // text/plain = CORS 簡單請求,免 preflight;端點未上線也只是靜默失敗,不影響頁面
          var body=JSON.stringify({reason:reason,ver:"1.27.30",ua:navigator.userAgent.slice(0,120)});
          if(navigator.sendBeacon){navigator.sendBeacon("https://api.hakkaren.uk/v1/uninstall_feedback",new Blob([body],{type:"text/plain"}));}
          else{fetch("https://api.hakkaren.uk/v1/uninstall_feedback",{method:"POST",headers:{"Content-Type":"text/plain"},body:body,keepalive:true}).catch(function(){});}
        }catch(e){}
        document.getElementById("ask").style.display="none";
        document.getElementById("thanks").style.display="block";
      });
    });
  </script>
</body>
</html>
